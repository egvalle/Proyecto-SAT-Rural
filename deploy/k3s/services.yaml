apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-next
  namespace: sat-rural
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-next
  template:
    metadata:
      labels:
        app: auth-next
    spec:
      containers:
        - name: auth-next
          image: sat-rural/auth-next:deploy
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_DB_HOST
              value: auth-db
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: AUTH_DB_PASSWORD
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: JWT_KEY
            - name: JWT_ISSUER
              value: SatRural.Api
            - name: JWT_AUDIENCE
              value: SatRural.Client
            - name: JWT_EXPIRES_MINUTES
              value: "60"
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: sat-rural-config
                  key: PUBLIC_URL
            - name: OAUTH_CALLBACK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: sat-rural-config
                  key: PUBLIC_URL
            - name: AUDIT_SERVICE_URL
              value: http://audit-service:8000/
            - name: AUDIT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: AUDIT_SERVICE_API_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: GITHUB_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: GITHUB_CLIENT_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-next
  namespace: sat-rural
spec:
  selector:
    app: auth-next
  ports:
    - port: 8080
---
apiVersion: apps/v1
