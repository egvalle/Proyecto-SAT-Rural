apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: sat-rural
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
    spec:
      containers:
        - name: alert-service
          image: sat-rural/alert-service:deploy
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://alert-db:5432/satrural_alerts
            - name: SPRING_DATASOURCE_USERNAME
              value: satrural_alerts
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: ALERT_DB_PASSWORD
            - name: ALERT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: ALERT_SERVICE_API_KEY
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: JWT_KEY
            - name: JWT_ISSUER
              value: SatRural.Api
            - name: JWT_AUDIENCE
              value: SatRural.Client
            - name: SERVER_PORT
              value: "8080"
            - name: AUDIT_SERVICE_BASE_URL
              value: http://audit-service:8000
            - name: AUDIT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: AUDIT_SERVICE_API_KEY
            - name: GMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: GMAIL_USERNAME
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: GMAIL_APP_PASSWORD
            - name: ALERT_NOTIFICATIONS_RECIPIENTS
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: ALERT_NOTIFICATIONS_RECIPIENTS
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=65
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: sat-rural
spec:
  selector:
    app: alert-service
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-service
  namespace: sat-rural
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-service
  template:
    metadata:
      labels:
        app: sensor-service
    spec:
      containers:
        - name: sensor-service
          image: sat-rural/sensor-service:deploy
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: MSSQL_SA_PASSWORD
            - name: ConnectionStrings__SensorDatabase
              value: Server=sqlserver,1433;Database=satrural_sensors;User Id=sa;Password=$(MSSQL_SA_PASSWORD);TrustServerCertificate=True;Encrypt=False
            - name: SensorIngestion__ApiKey
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: SENSOR_DEVICE_API_KEY
            - name: Simulation__Enabled
              value: "true"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: JWT_KEY
            - name: Jwt__Issuer
              value: SatRural.Api
            - name: Jwt__Audience
              value: SatRural.Client
            - name: AlertService__BaseUrl
              value: http://alert-service:8080/
            - name: AlertService__ApiKey
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: ALERT_SERVICE_API_KEY
            - name: CommunityService__BaseUrl
              value: http://community-service:8080/
            - name: AuditService__BaseUrl
              value: http://audit-service:8000/
            - name: AuditService__ApiKey
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: AUDIT_SERVICE_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-service
  namespace: sat-rural
spec:
  selector:
    app: sensor-service
  ports:
    - port: 8080
