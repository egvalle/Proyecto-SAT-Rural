                  name: sat-rural-env
                  key: JWT_KEY
            - name: JWT_ISSUER
              value: SatRural.Api
            - name: JWT_AUDIENCE
              value: SatRural.Client
            - name: AUDIT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
