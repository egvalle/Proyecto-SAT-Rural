apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: sat-rural
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
        - name: report-service
          image: sat-rural/report-service:deploy
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_URI
              value: mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@mongodb:27017/?authSource=admin
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: JWT_KEY
            - name: JWT_ISSUER
              value: SatRural.Api
            - name: JWT_AUDIENCE
              value: SatRural.Client
            - name: REPORT_DATA_API_URL
              value: http://gateway:8080
            - name: ALERTS_API_URL
              value: http://alert-service:8080/api/alerts
            - name: REPORT_STORAGE_PATH
              value: /app/storage
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: report-files
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: sat-rural
spec:
  selector:
    app: report-service
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sat-rural
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: sat-rural/gateway:deploy
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ReverseProxy__Clusters__auth-next__Destinations__destination1__Address
              value: http://auth-next:8080/
            - name: ReverseProxy__Clusters__community-service__Destinations__destination1__Address
              value: http://community-service:8080/
            - name: ReverseProxy__Clusters__report-service__Destinations__destination1__Address
              value: http://report-service:8000/
            - name: ReverseProxy__Clusters__sensor-service__Destinations__destination1__Address
              value: http://sensor-service:8080/
            - name: ReverseProxy__Clusters__alert-service__Destinations__destination1__Address
              value: http://alert-service:8080/
            - name: ReverseProxy__Clusters__audit-service__Destinations__destination1__Address
              value: http://audit-service:8000/
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: sat-rural-env
                  key: JWT_KEY
            - name: Jwt__Issuer
              value: SatRural.Api
            - name: Jwt__Audience
              value: SatRural.Client
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sat-rural
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
---
