<app-component-card title="Registro de usuarios" desc="Registra y consulta los usuarios del sistema.">
  <div class="container-fluid px-0">
    
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
       
        <div class="row g-3">
          <div class="col-md-6">
            <label for="sensorCode" class="form-label">Nombre</label>
            <input id="sensorCode" name="sensorCode" type="text" class="form-control">
          </div>

          <div class="col-md-6">
            <label for="sensorName" class="form-label">Contraseña</label>
            <input id="sensorName" name="sensorName" type="text" class="form-control" >
          </div>

          <div class="col-md-6">
            <label for="sensorType" class="form-label">Role</label>
            <div class="input-group">
              <select id="sensorType" name="sensorType" class="form-select">
                <option value="">Todos los roles</option>
                <option value="1">Administrador</option>
                <option value="2">Usuario</option>
              </select>
              <button type="button" class="btn btn-primary">Grabar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
          <div>
            <h2 class="h5 mb-1">Listado de Usuarios</h2>
            <p class="text-body-secondary mb-0">Consulta el usuarios</p>
          </div>
          <!-- <button type="button" class="btn btn-primary"> -->
            <!-- <span aria-hidden="true">+</span> -->
            <!-- Grabar
          </button> -->
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="sensorSearch" class="form-label">Buscar usuario</label>
            <input id="sensorSearch" name="sensorSearch" type="search" class="form-control"
              placeholder="Nombre o identificador">
          </div>
          <div class="col-md-4">
            <label for="sensorFilterStatus" class="form-label">Rol</label>
            <div class="input-group">
              <select id="sensorFilterStatus" name="sensorFilterStatus" class="form-select">
                <option value="">Todos los roles</option>
                <option value="1">Administrador</option>
                <option value="2">Usuario</option>
              </select>
              <button type="button" class="btn btn-outline-primary">Filtrar</button>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">Sensor</th>
                <th scope="col">Tipo</th>
                <th scope="col">Ubicación</th>
                <th scope="col">Última lectura</th>
                <th scope="col">Estado</th>
                <th scope="col" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</app-component-card>
