<section
  class="system-status d-flex flex-column flex-md-row
         align-items-md-center justify-content-between gap-3">

  <div>

    <div class="d-flex align-items-center gap-2 mb-1">

      <span class="status-indicator"></span>

      <h2 class="mb-0">
        {{ title }}
      </h2>

    </div>

    <p class="mb-0">
      {{ description }}
    </p>

  </div>

  <div class="update-time d-flex align-items-center gap-2">

    <i class="bi bi-clock"></i>

    <span>
      {{ updatedAt }}
    </span>

  </div>

</section>
