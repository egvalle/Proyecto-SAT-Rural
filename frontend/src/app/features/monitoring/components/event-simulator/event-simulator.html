<section class="simulator-panel h-100">

  <div
    class="panel-header d-flex
           align-items-center
           justify-content-between">

    <h3 class="mb-0">
      Simulador de eventos
    </h3>

    <span>
      Administrador y operador
    </span>

  </div>

  @if (canWrite) {
    <div class="p-4">

      <p class="text-body-secondary mb-3">
        El escenario se aplica a todas las comunidades con sensores simulados activos.
      </p>

      <label
        for="scenario"
        class="form-label">

        Escenario de demostración

      </label>

      <select
        id="scenario"
        class="form-select"
        [(ngModel)]="scenario">

        <option value="HEAVY_RAIN">
          Lluvia intensa
        </option>

        <option value="STORM">
          Tormenta
        </option>

        <option value="FLOOD">
          Riesgo de inundación
        </option>

        <option value="DROUGHT">
          Sequía
        </option>

        <option value="FROST">
          Helada
        </option>

        <option value="FOREST_FIRE">
          Incendio forestal
        </option>

      </select>

      <div
        class="d-flex
               flex-column flex-sm-row
               gap-2 mt-3">

        <button
          type="button"
          class="btn btn-success"
          [disabled]="running"
          (click)="run()">

          <i class="bi bi-play-fill me-1"></i>
          Ejecutar escenario

        </button>

        <button
          type="button"
          class="btn btn-light"
          [disabled]="running"
          (click)="reset()">

          <i class="bi bi-stop-fill me-1"></i>
          Detener simulación

        </button>

      </div>

      <div class="simulation-message mt-3">
        {{ message }}
      </div>

    </div>
  } @else {
    <div class="p-4">
      <p class="mb-0" role="status">Modo de solo lectura.</p>
    </div>
  }

</section>
