<section class="chart-panel h-100">

  <div
    class="panel-header d-flex
           flex-column flex-sm-row
           align-items-sm-center
           justify-content-between gap-3">

    <div>
      <h3 class="mb-1">
        Evolución de sensores
      </h3>

      <p class="mb-0">
        Comportamiento durante las últimas horas
      </p>
    </div>

    <div class="d-flex align-items-center gap-2">

      <span class="live-indicator">
        <i class="bi bi-database"></i>
        Datos simulados
      </span>

      <button
        type="button"
        class="chart-options"
        aria-label="Opciones del gráfico">

        <i class="bi bi-three-dots"></i>

      </button>

    </div>

  </div>

  <div class="chart-container">
    <canvas #sensorChart></canvas>
  </div>

</section>
