@if (isOpen) {

  <div
    class="modal"
    style="
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-y: auto;
    "
    role="dialog"
    aria-modal="true">

    <!-- Fondo oscuro -->

    @if (!isFullscreen) {

      <div
        style="
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          background: rgba(156, 163, 175, 0.5);
          backdrop-filter: blur(8px);
        "
        (click)="onBackdropClick($event)">
      </div>

    }


    <!-- CONTENEDOR DEL MODAL -->

    <div
      [ngClass]="
        isFullscreen
          ? 'w-full h-full'
          : 'relative w-full max-w-3xl rounded-3xl bg-white dark:bg-gray-900'
      "
      [class]="className"
      style="
        max-height: 90vh;
        overflow: hidden;
        z-index: 100000;
      "
      (click)="onContentClick($event)">


      <!-- BOTÓN CERRAR -->

      @if (showCloseButton) {

        <button
          type="button"
          (click)="close.emit()"
          aria-label="Cerrar"
          style="
            position: absolute;
            right: 1rem;
            top: 1rem;
            z-index: 100001;
          "
          class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-100 text-gray-400 transition-colors hover:bg-gray-200 hover:text-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">

          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg">

            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M6.04289 16.5413C5.65237 16.9318 5.65237 17.565 6.04289 17.9555C6.43342 18.346 7.06658 18.346 7.45711 17.9555L11.9987 13.4139L16.5408 17.956C16.9313 18.3466 17.5645 18.346 17.955 17.956C18.3455 17.5655 18.3455 16.9323 17.955 16.5418L13.4129 11.9997L17.955 7.4576C18.3455 7.06707 18.3455 6.43391 17.955 6.04338C17.5645 5.65286 16.9313 5.65286 16.5408 6.04338L11.9987 10.5855L7.45711 6.0439C7.06658 5.65338 6.43342 5.65338 6.04289 6.0439L10.5845 11.9997L6.04289 16.5413Z"
              fill="currentColor">
            </path>

          </svg>

        </button>

      }


      <!-- CONTENIDO DEL MODAL -->

      <div
        style="
          max-height: 90vh;
          overflow-y: auto;
          overflow-x: hidden;
          overscroll-behavior: contain;
        "
        class="modal-scroll-content">

        <ng-content></ng-content>

      </div>

    </div>

  </div>

}
