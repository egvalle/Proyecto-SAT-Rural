server:
  port: 8080

spring:
  application:
    name: alert-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://alert-db:5432/satrural_alerts}
    username: ${SPRING_DATASOURCE_USERNAME:satrural_alerts}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

satrural:
  integration:
    api-key: ${ALERT_SERVICE_API_KEY}
  security:
    jwt-key: ${JWT_KEY}
    issuer: ${JWT_ISSUER:SatRural.Api}
    audience: ${JWT_AUDIENCE:SatRural.Client}
  audit:
    base-url: ${AUDIT_SERVICE_BASE_URL:http://audit-service:8000}
    api-key: ${AUDIT_SERVICE_API_KEY}
  community:
    base-url: ${COMMUNITY_SERVICE_BASE_URL:http://community-service:8080}
  notifications:
    recipients: ${ALERT_NOTIFICATIONS_RECIPIENTS:}
